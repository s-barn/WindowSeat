name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore WindowSeat.sln

      - name: Build (Release)
        run: >
          dotnet build WindowSeat.sln
          --configuration Release
          --no-restore
          /p:Version=${{ steps.version.outputs.VERSION }}

      - name: Run tests
        run: >
          dotnet test src/WindowSeat.Tests/WindowSeat.Tests.csproj
          --configuration Release
          --no-build
          --verbosity normal

      - name: Publish app
        run: >
          dotnet publish src/WindowSeat.App/WindowSeat.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          --output publish/
          /p:Version=${{ steps.version.outputs.VERSION }}

      # ── MSIX packaging ────────────────────────────────────────────────────
      # TODO: Wire up Windows Application Packaging Project (wapproj) here
      # once packaging/ scaffold is complete. For v1.0, zip the publish output
      # as a stopgap so users can still download and run.

      - name: Package (stopgap zip)
        shell: pwsh
        run: |
          Compress-Archive -Path publish/* -DestinationPath "WindowSeat-${{ steps.version.outputs.VERSION }}-win-x64.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: WindowSeat ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            WindowSeat-${{ steps.version.outputs.VERSION }}-win-x64.zip
